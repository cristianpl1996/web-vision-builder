# SINERGIA: base de datos + API + web.
#
#   Como en producción (web construida y servida por Caddy):
#     docker compose up -d --build                 → http://localhost:8090
#
#   Desarrollo (frontend con recarga en caliente + correos atrapados en Mailpit):
#     docker compose --profile dev up -d --build   → http://localhost:5174  (Vite)
#                                                     http://localhost:8025  (Mailpit: los correos)
#
#   Tests del backend: corren contra `sinergia_test` en este mismo Postgres (ver CLAUDE.md).
name: sinergia

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sinergia
      POSTGRES_USER: sinergia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sinergia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 en la máquina para no chocar con otro Postgres (Hubu); tests y alembic lo usan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinergia -d sinergia"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sinergia:${POSTGRES_PASSWORD:-sinergia}@db:5432/sinergia
    volumes:
      - media:/data/media                 # fotos de productos (públicas)
      - comprobantes:/data/comprobantes   # comprobantes de pago (privados: solo por la API)
    ports:
      - "8000:8000"         # API directa: http://localhost:8000/v1/docs
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy

  # ── Solo desarrollo (perfil `dev`) ───────────────────────────────────────────

  # Atrapa TODOS los correos que manda la tienda: nada sale a internet.
  # El .env de ejemplo ya apunta aquí (SMTP_HOST=mailpit, SMTP_PORT=1025).
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["dev"]
    ports:
      - "8025:8025"         # bandeja: http://localhost:8025

  frontend-dev:
    image: node:22-slim
    profiles: ["dev"]
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      VITE_PROXY_TARGET: http://backend:8000   # /v1 y /health → backend en la red de compose
      VITE_USE_POLLING: "true"                 # bind-mount de Windows: el watch nativo no basta
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules   # node_modules de Linux, aparte de los de Windows
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  media:
  comprobantes:
  frontend_node_modules:
